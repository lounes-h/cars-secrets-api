[project]
name = "cars-secrets-api"
version = "0.4.1"
description = "Car's Secrets API: vehicle auction intelligence over its own lot database"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.30",
    "psycopg[binary,pool]>=3.2",
    "pydantic-settings>=2.4",
    "pydantic[email]>=2.8",
    "alembic>=1.13",
    "sqlalchemy>=2.0",
    "argon2-cffi>=23.1",
    "pyjwt[crypto]>=2.9",
    "phonenumbers>=8.13",
    "httpx>=0.27",
]

[dependency-groups]
dev = [
    "pytest>=8.3",
    "testcontainers[postgres]>=4.8",
    "ruff>=0.6",
    "pytest-cov>=7.1.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["app"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "SIM"]

[tool.coverage.run]
source = ["app"]
branch = true

[tool.coverage.report]
# `uv run pytest --cov` fails below this (see AGENTS.md, Tests).
fail_under = 95
show_missing = true
skip_covered = true
