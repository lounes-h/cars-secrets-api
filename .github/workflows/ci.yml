name: CI

on:
  pull_request:
  push:
    branches: [main]

jobs:
  checks:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_USER: test
          POSTGRES_PASSWORD: test
          POSTGRES_DB: test
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U test -d test" --health-interval 2s
          --health-timeout 3s --health-retries 30
    env:
      TEST_DATABASE_URL: postgresql://test:test@localhost:5432/test
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
      - run: uv sync --frozen
      - run: uv run ruff check app tests migrations
      - run: uv run pytest --cov

  commits:
    # The release reads commit subjects to pick the next version, so each must be conventional.
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - run: |
          bad=$(git log --no-merges --format=%s "$BASE..$HEAD" \
            | grep -vE '^((feat|fix|perf|refactor|revert|docs|test|chore|ci|build|style)(\([^)]+\))?!?: |Revert ")' || true)
          if [ -n "$bad" ]; then
            printf 'Use "type: subject" (feat, fix, perf, refactor, docs, test, chore, ...):\n%s\n' "$bad"
            exit 1
          fi
        env:
          BASE: ${{ github.event.pull_request.base.sha }}
          HEAD: ${{ github.event.pull_request.head.sha }}

  release:
    # Each push to main that passes the checks is released: semantic-release reads the commits
    # since the last tag, bumps pyproject.toml and uv.lock (feat: minor; fix, perf, refactor:
    # patch; "!" or BREAKING CHANGE: major), commits them with CHANGELOG.md, tags vX.Y.Z and
    # publishes a GitHub release. Nothing to release (docs, test, chore only) is a no-op.
    if: github.event_name == 'push'
    needs: checks
    runs-on: ubuntu-latest
    timeout-minutes: 10
    # One release at a time, never cancelled halfway.
    concurrency: release
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: astral-sh/setup-uv@v6
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - run: >-
          npx --yes
          -p semantic-release@25
          -p @semantic-release/changelog@7
          -p @semantic-release/exec@7
          -p @semantic-release/git@11
          -p conventional-changelog-conventionalcommits@9
          semantic-release
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
